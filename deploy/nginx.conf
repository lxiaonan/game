# 《熊二的世界》静态托管配置
#
# 这个项目是纯前端:服务器只负责把文件发出去,不做任何计算。
# 实测 Python 自带的 http.server 服务整个游戏只占 10MB 内存、1 个线程、
# 全程 5.69 秒 CPU —— 所以 2 核 2G 的机器完全是浪费,瓶颈在客户端显卡和带宽。
#
# 用法:
#   node tools/pack.mjs                     # 先打包出 dist/
#   sudo cp -r dist/* /var/www/xionger/
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/xionger
#   sudo ln -s /etc/nginx/sites-available/xionger /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    # 有域名和证书时,listen 443 ssl http2; 并配置 ssl_certificate
    server_name _;

    root /var/www/xionger;
    index index.html;

    # 只要文件在磁盘缓存里,发送就是零拷贝;28MB 的资源 2G 内存随便放得下
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    open_file_cache max=200 inactive=60s;
    open_file_cache_valid 120s;

    # 文本资源压缩。PNG 本身已是压缩格式,gzip 再压几乎没收益,所以不列进来
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types
        text/html
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # ---- 缓存策略 ----
    # 没有构建哈希,所以贴图用长缓存但可协商,HTML 每次校验
    location ~* \.(png|webp|jpg|jpeg|gif)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    location ~* \.(js|css)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # 首屏要拉 37 个文件、共约 28MB,并发连接数给足
    # (如果开了 http2,浏览器会在一条连接上多路复用,这项就不太重要了)
}
